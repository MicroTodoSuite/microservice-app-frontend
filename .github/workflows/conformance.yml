name: conformance

# Contract conformance gate (spec 007 / US1 deep layer). Runs Schemathesis against
# the live services via the reusable stack-tests workflow; an implementation that
# drifts from its OpenAPI contract fails the gate (SC-001).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    uses: MicroTodoSuite/.github/.github/workflows/stack-tests.yml@94850da6cdcdb1ac1f9a5d65f0bd3dc8e8658eab
    with:
      gate-name: conformance
      compose-file: e2e/compose.yaml
      stack-repos: >-
        microservice-app-auth-api
        microservice-app-todos-api
        microservice-app-users-api
        microservice-app-log-message-processor
      ready-command: >-
        timeout 240 bash -c 'until curl -sf -X POST http://localhost:8080/login
        -H "content-type: application/json"
        -d "{\"username\":\"admin\",\"password\":\"admin\"}" -o /dev/null;
        do sleep 3; done'
      stack-command: >-
        cd "$CALLER_DIR/e2e" &&
        python -m pip install --quiet 'schemathesis==3.39.5' 'hypothesis==6.112.1' &&
        bash conformance/run.sh

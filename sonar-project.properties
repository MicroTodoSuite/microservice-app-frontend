# SonarQube project config (spec 006 / T001). Coverage from Jest (lcov); the
# quality gate stays visibly skipped until the self-hosted server exists.
sonar.projectKey=MicroTodoSuite_frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js
sonar.exclusions=**/*.test.js,node_modules/**,coverage/**,build/**,config/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Build tooling and SFCs are out of the unit-coverage denominator (research D2).
sonar.coverage.exclusions=build/**,config/**,src/**/*.vue,src/main.js
